<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta Virtuouse Acessórios</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #EAE3DC;
            --taupe-logo: #A68E74;
            --brown-deep: #5A3C28;
            --brown-medium: #7A5843;
            --beige-soft: #DFD5C8;
            --gold-accent: #C5A368;
            --white-off: #FAF8F5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #F3EFEA 0%, #DFD5C8 100%);
            color: var(--brown-deep);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 24px 40px;
            font-family: 'Montserrat', sans-serif;
        }

        /* LADO ESQUERDO: Roleta */
        .wheel-container {
            position: relative;
            height: 88vh;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas#wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 
                0 0 0 10px var(--white-off),
                0 0 0 13px var(--gold-accent),
                0 20px 45px rgba(90, 60, 40, 0.28);
        }

        /* Ponteiro superior */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 42px solid var(--brown-deep);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
            z-index: 10;
        }
        .pointer::after {
            content: '';
            position: absolute;
            top: -40px;
            left: -14px;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 34px solid var(--gold-accent);
        }

        /* LADO DIREITO: Identidade Visual e Controles */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }

        /* Card da Logo */
        .logo-card {
            background-color: var(--taupe-logo);
            width: 100%;
            padding: 28px 24px;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(90, 60, 40, 0.15);
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .logo-vector-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 3.6rem;
            font-weight: 400;
            color: #FFFFFF;
            letter-spacing: 1px;
            line-height: 1;
        }

        .logo-vector-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: #FFFFFF;
            letter-spacing: 7px;
            margin-top: 8px;
            text-indent: 7px;
        }

        .pill-badge {
            border: 1px solid var(--brown-deep);
            border-radius: 50px;
            padding: 6px 26px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 2px;
            color: var(--brown-deep);
            margin-bottom: 12px;
            text-transform: lowercase;
        }

        h1.editorial-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--brown-deep);
            text-transform: uppercase;
            line-height: 1.15;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 1.45rem;
            color: var(--brown-medium);
            margin-bottom: 32px;
        }

        button#spinBtn {
            background-color: var(--brown-deep);
            color: var(--white-off);
            border: 1px solid var(--gold-accent);
            border-radius: 50px;
            padding: 20px 48px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(90, 60, 40, 0.3);
            transition: all 0.25s ease;
            width: 100%;
        }

        button#spinBtn:active {
            transform: scale(0.97);
        }

        button#spinBtn:disabled {
            background-color: #B5A89C;
            border-color: transparent;
            color: #EAE3DC;
            box-shadow: none;
            cursor: not-allowed;
        }

        .utility-bar {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .util-btn {
            background: transparent;
            color: var(--brown-medium);
            border: 1px solid rgba(90, 60, 40, 0.3);
            border-radius: 20px;
            padding: 8px 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .util-btn:active {
            background: rgba(90, 60, 40, 0.1);
        }

        /* OVERLAY DE PRÊMIO E CONFETES */
        #overlay, #settingsOverlay {
            position: fixed;
            inset: 0;
            background: rgba(45, 29, 18, 0.82);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        canvas#confetti {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .modal {
            position: relative;
            background: var(--white-off);
            color: var(--brown-deep);
            padding: 36px 40px;
            border-radius: 24px;
            border: 2px solid var(--gold-accent);
            text-align: center;
            width: 92%;
            max-width: 780px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.45);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 101;
        }

        .modal-settings {
            max-width: 560px;
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Layout horizontal na tela de resultado (Prêmio à esquerda | QR Code à direita) */
        .result-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
        }

        .result-left {
            flex: 1.25;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-right {
            flex: 0.85;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            padding: 20px 18px;
            border-radius: 18px;
            border: 1px solid #E5DDD5;
            box-shadow: 0 8px 22px rgba(90, 60, 40, 0.08);
        }

        .qr-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--brown-medium);
            margin-bottom: 10px;
        }

        .qr-frame {
            width: 210px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .modal .pill-badge {
            display: inline-block;
            margin-bottom: 12px;
        }

        .modal h2 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--brown-deep);
            margin-bottom: 18px;
        }

        .prize-box {
            width: 100%;
            padding: 28px 20px;
            border-radius: 14px;
            border: 1px solid var(--gold-accent);
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 26px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.08);
        }

        .close-btn {
            background: var(--brown-deep);
            color: var(--white-off);
            border: 1px solid var(--gold-accent);
            border-radius: 50px;
            padding: 15px 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* ESTILOS DO PAINEL DE QUANTIDADES */
        .qty-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
            text-align: left;
        }

        .qty-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #F3EFEA;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid #DFD5C8;
        }

        .qty-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 0.98rem;
            color: var(--brown-deep);
            letter-spacing: 1px;
        }

        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .qty-select {
            padding: 7px 16px;
            border-radius: 8px;
            border: 1px solid var(--taupe-logo);
            background: var(--white-off);
            color: var(--brown-deep);
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-secondary {
            background: transparent;
            color: var(--brown-medium);
            border: 1px solid var(--taupe-logo);
            border-radius: 50px;
            padding: 15px 28px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .error-msg {
            color: #B71C1C;
            font-size: 0.85rem;
            margin-bottom: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Lado Esquerdo: A Roleta -->
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="900" height="900"></canvas>
    </div>

    <!-- Lado Direito: Identidade Virtuouse + Botões -->
    <div class="controls">
        <div class="logo-card">
            <div class="logo-vector-title">Virtuouse</div>
            <div class="logo-vector-sub">ACESSÓRIOS</div>
        </div>

        <div class="pill-badge">conheça a</div>
        <h1 class="editorial-title">VIRTUOUSE</h1>
        <p class="subtitle">Gire e descubra o seu presente especial</p>

        <button id="spinBtn" onclick="girarRoleta()">GIRAR ROLETA</button>

        <div class="utility-bar">
            <button class="util-btn" onclick="ativarTelaCheia()">⛶ Tela Cheia</button>
            <button class="util-btn" onclick="abrirConfiguracoes()">⚙️ Quantidades</button>
        </div>
    </div>

    <!-- Cena de Explosão de Confetes, Resultado e QR Code Local -->
    <div id="overlay">
        <canvas id="confetti"></canvas>
        <div class="modal">
            <div class="result-content">
                <!-- Coluna Esquerda: Prêmio Sorteado -->
                <div class="result-left">
                    <div class="pill-badge">parabéns pelo seu mimo</div>
                    <h2>VOCÊ GANHOU:</h2>
                    <div id="prizeBox" class="prize-box">PORTA JÓIAS</div>
                    <button class="close-btn" onclick="fecharModal()">NOVO GIRO</button>
                </div>

                <!-- Coluna Direita: Imagem Local do QR Code (qrcode.png) -->
                <div class="result-right">
                    <div class="qr-title">Siga nosso Instagram</div>
                    <div class="qr-frame">
                        <img src="qrcode.png" alt="QR Code Instagram @virtuouse_">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Configuração de Quantidades (0 a 20) -->
    <div id="settingsOverlay">
        <div class="modal modal-settings">
            <div class="pill-badge">configuração</div>
            <h2>QUANTIDADES NA ROLETA</h2>
            <div id="qtyList" class="qty-list"></div>
            <div id="errorMsg" class="error-msg">Selecione pelo menos 1 item no total para girar a roleta.</div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="fecharConfiguracoes()">CANCELAR</button>
                <button class="close-btn" onclick="salvarConfiguracoes()">SALVAR</button>
            </div>
        </div>
    </div>

<script>
    // Configuração padrão inicial dos 6 tipos de prêmios
    const premiosBase = [
        { id: "porta_joias", nome: "PORTA JÓIAS",        qtdPadrao: 2, cor: "#5A3C28", texto: "#FAF8F5" },
        { id: "escova",      nome: "ESCOVA DE CABELO",   qtdPadrao: 2, cor: "#C5A368", texto: "#FAF8F5" },
        { id: "acessorio",   nome: "ACESSÓRIO SURPRESA", qtdPadrao: 2, cor: "#7A5843", texto: "#FAF8F5" },
        { id: "home_spray",  nome: "HOME SPRAY",         qtdPadrao: 2, cor: "#8C6D53", texto: "#FAF8F5" },
        { id: "desconto",    nome: "5% OFF",             qtdPadrao: 7, cor: "#DFD5C8", texto: "#5A3C28" },
        { id: "pao_de_mel",  nome: "+1 PÃO DE MEL",      qtdPadrao: 7, cor: "#A68E74", texto: "#FAF8F5" }
    ];

    const STORAGE_KEY = 'virtuouse_quantidades_v2';
    let quantidadesAtuais = {};
    let fatias = [];

    const wheelCanvas = document.getElementById('wheel');
    const ctx = wheelCanvas.getContext('2d');
    let rotacaoAtual = 0;
    let girando = false;

    // Gerador de números verdadeiramente aleatórios (Criptográfico)
    function numeroAleatorioReal() {
        if (window.crypto && window.crypto.getRandomValues) {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] / (0xFFFFFFFF + 1);
        }
        return Math.random();
    }

    function inteiroAleatorio(min, max) {
        return Math.floor(numeroAleatorioReal() * (max - min + 1)) + min;
    }

    function inicializarQuantidades() {
        const salvo = localStorage.getItem(STORAGE_KEY);
        if (salvo) {
            try {
                const parsed = JSON.parse(salvo);
                premiosBase.forEach(item => {
                    quantidadesAtuais[item.id] = parsed[item.id] !== undefined ? parsed[item.id] : item.qtdPadrao;
                });
            } catch (e) {
                definirPadrao();
            }
        } else {
            definirPadrao();
        }
        construirFatias();
    }

    function definirPadrao() {
        premiosBase.forEach(item => {
            quantidadesAtuais[item.id] = item.qtdPadrao;
        });
    }

    function construirFatias() {
        let grupos = premiosBase.map(item => ({
            ...item,
            restante: quantidadesAtuais[item.id] !== undefined ? quantidadesAtuais[item.id] : item.qtdPadrao
        })).filter(g => g.restante > 0);

        let total = grupos.reduce((acc, g) => acc + g.restante, 0);
        let resultado = [];
        let ultimoId = null;

        for (let i = 0; i < total; i++) {
            grupos.sort((a, b) => (b.restante - a.restante) || (numeroAleatorioReal() - 0.5));

            let candidatos = grupos.filter(g => g.restante > 0 && g.id !== ultimoId);
            if (candidatos.length === 0) {
                candidatos = grupos.filter(g => g.restante > 0);
            }

            let escolhido;
            if (candidatos[0].restante > Math.ceil((total - i) / 2)) {
                escolhido = candidatos[0];
            } else {
                const idx = inteiroAleatorio(0, Math.min(candidatos.length - 1, 1));
                escolhido = candidatos[idx];
            }

            let corFatia = escolhido.cor;
            let corTexto = escolhido.texto;
            if (ultimoId === escolhido.id) {
                corFatia = "#7A5843";
                corTexto = "#FAF8F5";
            }

            resultado.push({
                id: escolhido.id,
                nome: escolhido.nome,
                cor: corFatia,
                texto: corTexto
            });

            escolhido.restante--;
            ultimoId = escolhido.id;
        }

        if (resultado.length > 1) {
            const deslocamento = inteiroAleatorio(0, resultado.length - 1);
            resultado = resultado.slice(deslocamento).concat(resultado.slice(0, deslocamento));
        }

        fatias = resultado;
        desenharRoleta();
    }

    function desenharRoleta() {
        const cx = 450, cy = 450, raio = 442;
        ctx.clearRect(0, 0, 900, 900);

        const numFatias = fatias.length;
        if (numFatias === 0) return;

        const anguloFatia = (2 * Math.PI) / numFatias;

        let tamanhoFonte = 29;
        if (numFatias > 32) tamanhoFonte = 18;
        else if (numFatias > 24) tamanhoFonte = 21;
        else if (numFatias > 18) tamanhoFonte = 25;

        fatias.forEach((fatia, i) => {
            const anguloIni = i * anguloFatia;
            const anguloFim = anguloIni + anguloFatia;

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, raio, anguloIni, anguloFim);
            ctx.closePath();
            ctx.fillStyle = fatia.cor;
            ctx.fill();

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#F3EFEA";
            ctx.stroke();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(anguloIni + anguloFatia / 2);
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillStyle = fatia.texto;
            ctx.font = `700 ${tamanhoFonte}px 'Cormorant Garamond', Georgia, serif`;
            ctx.fillText(fatia.nome, raio - 22, 1, 335);
            ctx.restore();
        });

        // Centro da roleta com inicial "V"
        ctx.beginPath();
        ctx.arc(cx, cy, 58, 0, 2 * Math.PI);
        ctx.fillStyle = "#FAF8F5";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#C5A368";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, 44, 0, 2 * Math.PI);
        ctx.fillStyle = "#5A3C28";
        ctx.fill();

        ctx.fillStyle = "#FAF8F5";
        ctx.font = "400 38px 'Cormorant Garamond', Georgia, serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("V", cx, cy + 2);
    }

    function girarRoleta() {
        if (girando || fatias.length === 0) return;
        girando = true;
        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        btn.innerText = "SORTEANDO...";

        const numFatias = fatias.length;
        const anguloGraus = 360 / numFatias;

        // 1. Sorteia a duração aleatória entre 5.0 e 12.0 segundos
        const duracaoMs = inteiroAleatorio(5000, 12000);
        const duracaoSegundos = (duracaoMs / 1000).toFixed(2);

        // 2. Sorteia a fatia vencedora com entropia criptográfica
        const indiceSorteado = inteiroAleatorio(0, numFatias - 1);
        const centroFatia = indiceSorteado * anguloGraus + (anguloGraus / 2);
        const variacao = (numeroAleatorioReal() - 0.5) * (anguloGraus * 0.65);

        const alvoNoCirculo = (270 - centroFatia + variacao + 360) % 360;
        const modAtual = rotacaoAtual % 360;
        let diferenca = alvoNoCirculo - modAtual;
        if (diferenca < 0) diferenca += 360;

        // 3. Quantidade de voltas proporcional ao tempo sorteado
        const numVoltas = Math.round(duracaoMs / 750) + inteiroAleatorio(0, 2);
        rotacaoAtual += (numVoltas * 360) + diferenca;

        // 4. Aplica a transição dinâmica conforme o tempo sorteado nesta rodada
        wheelCanvas.style.transition = `transform ${duracaoSegundos}s cubic-bezier(0.12, 0.85, 0.20, 1)`;
        wheelCanvas.style.transform = `rotate(${rotacaoAtual}deg)`;

        setTimeout(() => {
            girando = false;
            btn.disabled = false;
            btn.innerText = "GIRAR ROLETA";
            mostrarPremio(fatias[indiceSorteado]);
        }, duracaoMs);
    }

    // Painel de Configuração de Quantidades (0 a 20)
    function abrirConfiguracoes() {
        if (girando) return;
        const container = document.getElementById('qtyList');
        container.innerHTML = '';
        document.getElementById('errorMsg').style.display = 'none';

        premiosBase.forEach(item => {
            const row = document.createElement('div');
            row.className = 'qty-row';

            const label = document.createElement('div');
            label.className = 'qty-label';
            label.innerHTML = `<span class="color-dot" style="background:${item.cor}"></span><span>${item.nome}</span>`;

            const select = document.createElement('select');
            select.className = 'qty-select';
            select.id = `select_${item.id}`;

            for (let n = 0; n <= 20; n++) {
                const opt = document.createElement('option');
                opt.value = n;
                opt.textContent = n;
                if (n === quantidadesAtuais[item.id]) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            }

            row.appendChild(label);
            row.appendChild(select);
            container.appendChild(row);
        });

        document.getElementById('settingsOverlay').style.display = 'flex';
    }

    function fecharConfiguracoes() {
        document.getElementById('settingsOverlay').style.display = 'none';
    }

    function salvarConfiguracoes() {
        let novasQuantidades = {};
        let somaTotal = 0;

        premiosBase.forEach(item => {
            const valor = parseInt(document.getElementById(`select_${item.id}`).value, 10);
            novasQuantidades[item.id] = valor;
            somaTotal += valor;
        });

        if (somaTotal === 0) {
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }

        quantidadesAtuais = novasQuantidades;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(quantidadesAtuais));
        construirFatias();
        fecharConfiguracoes();
    }

    // Explosão de Confetes e Modal do Vencedor
    let animConfeteId;
    function mostrarPremio(vencedor) {
        const prizeBox = document.getElementById('prizeBox');
        prizeBox.innerText = vencedor.nome;
        prizeBox.style.backgroundColor = vencedor.cor;
        prizeBox.style.color = vencedor.texto;
        document.getElementById('overlay').style.display = 'flex';
        iniciarConfetes();
    }

    function fecharModal() {
        document.getElementById('overlay').style.display = 'none';
        cancelAnimationFrame(animConfeteId);
    }

    function iniciarConfetes() {
        const cCanvas = document.getElementById('confetti');
        const cCtx = cCanvas.getContext('2d');
        cCanvas.width = window.innerWidth;
        cCanvas.height = window.innerHeight;

        const cores = ['#C5A368', '#E5C88E', '#5A3C28', '#A68E74', '#FAF8F5', '#D4AF37', '#DFD5C8'];
        const particulas = Array.from({ length: 170 }, () => {
            const angulo = numeroAleatorioReal() * Math.PI * 2;
            const vel = numeroAleatorioReal() * 19 + 5;
            return {
                x: cCanvas.width / 2,
                y: cCanvas.height / 2,
                vx: Math.cos(angulo) * vel,
                vy: Math.sin(angulo) * vel - 8,
                cor: cores[inteiroAleatorio(0, cores.length - 1)],
                tam: numeroAleatorioReal() * 14 + 7,
                rot: numeroAleatorioReal() * 360,
                vRot: (numeroAleatorioReal() - 0.5) * 14
            };
        });

        function renderizar() {
            cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
            particulas.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.36;
                p.rot += p.vRot;

                cCtx.save();
                cCtx.translate(p.x, p.y);
                cCtx.rotate((p.rot * Math.PI) / 180);
                cCtx.fillStyle = p.cor;
                cCtx.fillRect(-p.tam / 2, -p.tam / 2, p.tam, p.tam * 0.55);
                cCtx.restore();
            });
            animConfeteId = requestAnimationFrame(renderizar);
        }
        renderizar();
    }

    function ativarTelaCheia() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen();
        }
    }

    inicializarQuantidades();
    if (document.fonts) {
        document.fonts.ready.then(() => desenharRoleta());
    }
</script>
